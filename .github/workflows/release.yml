name: Publish skill release

on:
  push:
    branches: [main]
    paths:
      - 'skills/scientific-writing-mentor/SKILL.md'
      - 'release-notes/**'
      - 'scripts/build_release.py'
      - 'scripts/build_installer.py'
      - 'scripts/test_installer.py'
      - 'scripts/publish_release.py'
      - 'installer/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-skill-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            skills
            tests
            scripts
            release-notes
            installer
      - name: Verify comment contract
        run: python -m unittest discover -s tests -v
      - name: Build installable package
        id: package
        run: python scripts/build_release.py --github-output
      - name: Build offline Windows EXE
        run: python scripts/build_installer.py
      - name: Test install, verification and backup in an isolated home
        run: python scripts/test_installer.py
      - name: Publish assets while preserving existing version packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: python scripts/publish_release.py
