name: Publish skill release

on:
  push:
    branches: [main]
    paths:
      - 'skills/scientific-writing-mentor/SKILL.md'
      - 'release-notes/**'
      - 'scripts/build_release.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-skill-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            skills
            tests
            scripts
            release-notes
      - name: Verify comment contract
        run: python3 -m unittest discover -s tests -v
      - name: Build installable package
        id: package
        run: python3 scripts/build_release.py --github-output
      - name: Publish a new version without changing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Scientific Writing Mentor $RELEASE_TAG" \
            --notes-file "release-notes/$RELEASE_TAG.md" \
            --latest \
            "dist/scientific-writing-mentor-$RELEASE_TAG.zip" \
            dist/SHA256SUMS.txt
